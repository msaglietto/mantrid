version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: mantrid
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}{{ if eq .Os "linux" }}aarch64{{ else }}arm64{{ end }}
      {{- else if eq .Arch "arm" }}armv6
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Revert

brews:
  - repository:
      owner: msaglietto
      name: homebrew-tap
      # A PAT with `repo` scope on msaglietto/homebrew-tap. The default
      # Actions GITHUB_TOKEN is scoped to this repo only and cannot push here.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/msaglietto/mantrid"
    description: "CLI tool for managing aliases and dotfiles"
    license: "Apache-2.0"
    install: |
      bin.install "mantrid"
    test: |
      system "#{bin}/mantrid --version"

scoops:
  - repository:
      owner: msaglietto
      name: scoop-bucket
      # Same PAT as brews; required to push to the separate scoop-bucket repo.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/msaglietto/mantrid"
    description: "CLI tool for managing aliases and dotfiles"
    license: Apache-2.0

nfpms:
  - homepage: "https://github.com/msaglietto/mantrid"
    description: "CLI tool for managing aliases and dotfiles"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
    maintainer: "Mauricio Saglietto <msaglietto@gmail.com>"
    section: utils
    priority: optional
